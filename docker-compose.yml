version: "3.8"

services:
  # Infrastructure Services
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.15
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - eshop-network

  kafka:
    image: confluentinc/cp-kafka:7.2.15
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - eshop-network

  kafdrop:
    image: obsidiandynamics/kafdrop:3.27.0
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      - KAFKA_BROKERCONNECT=kafka:29092
      - JVM_OPTS=-Xms32M -Xmx64M
      - SERVER_PORT=9000
    depends_on:
      - kafka
    restart: always
    networks:
      - eshop-network

  # Backend Services
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - eshop-network

  product-service:
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
    container_name: product-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - eshop-network

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    container_name: user-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - eshop-network

  admin-service:
    build:
      context: .
      dockerfile: apps/admin-service/Dockerfile
    container_name: admin-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - eshop-network

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    container_name: order-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - eshop-network

  seller-service:
    build:
      context: .
      dockerfile: apps/seller-service/Dockerfile
    container_name: seller-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - eshop-network

  recommendation-service:
    build:
      context: .
      dockerfile: apps/recommendation-service/Dockerfile
    container_name: recommendation-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - eshop-network

  chatting-service:
    build:
      context: .
      dockerfile: apps/chatting-service/Dockerfile
    container_name: chatting-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - eshop-network

  kafka-service:
    build:
      context: .
      dockerfile: apps/kafka-service/Dockerfile
    container_name: kafka-service
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
      - KAFKA_BROKERS=kafka:29092
    env_file:
      - .env
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - eshop-network

  logger-service:
    build:
      context: .
      dockerfile: apps/logger-service/Dockerfile
    container_name: logger-service
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=production
      - PORT=3009
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - eshop-network

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
    env_file:
      - .env
    depends_on:
      - auth-service
      - product-service
      - user-service
      - order-service
      - seller-service
    restart: unless-stopped
    networks:
      - eshop-network

  # Frontend Services
  user-ui:
    build:
      context: .
      dockerfile: apps/user-ui/Dockerfile
    container_name: user-ui
    ports:
      - "3010:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - apps/user-ui/.env
    restart: unless-stopped
    networks:
      - eshop-network

  seller-ui:
    build:
      context: .
      dockerfile: apps/seller-ui/Dockerfile
    container_name: seller-ui
    ports:
      - "3011:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    env_file:
      - apps/seller-ui/.env
    restart: unless-stopped
    networks:
      - eshop-network

  admin-ui:
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
    container_name: admin-ui
    ports:
      - "3012:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
    env_file:
      - apps/admin-ui/.env
    restart: unless-stopped
    networks:
      - eshop-network

networks:
  eshop-network:
    driver: bridge
